<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="Kleven Jakt & Fiske produktbilde">
  <rect width="480" height="480" fill="#f4f3ef"/>
  <rect x="0" y="0" width="480" height="480" fill="url(#diag)" opacity="0.5"/>
  <defs>
    <pattern id="diag" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(45)">
      <rect width="10" height="20" fill="#ece9df"/>
    </pattern>
  </defs>
  <g transform="translate(240 220)" text-anchor="middle">
    <text x="0" y="-8" font-family="Montserrat, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2d3a" letter-spacing="2">KLEVEN</text>
    <text x="0" y="22" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="400" fill="#f0c548" letter-spacing="6">JAKT &amp; FISKE</text>
    <text x="0" y="58" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#8a96a1" letter-spacing="2">Produktbilde ikke tilgjengelig</text>
  </g>
</svg>
